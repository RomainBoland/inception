services:
  mariadb:
    build: requirements/mariadb
    container_name: inception_mariadb
    secrets:
      - db_admin_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: always
    env_file:
      - .env
  
  wordpress:
    build: requirements/wordpress
    container_name: inception_wordpress
    secrets:
      - wp_admin_password
      - db_password
    env_file:
      - .env
    networks:
      - inception
    depends_on:
      - mariadb
    volumes:
      - wp_data:/var/www/html

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_admin_password:
    file: ../secrets/db_admin_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  
networks:
  inception:
    driver: bridge


volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/db_data
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/wp_data