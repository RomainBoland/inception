secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_admin_password:
    file: ../secrets/db_admin_password.txt

services:
  mariadb:
    build: requirements/mariadb
    container_name: inception_mariadb
    secrets:
      - db_admin_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - inception
    restart: always
    env_file:
      - .env
  
networks:
  inception:
    driver: bridge


volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/db_data